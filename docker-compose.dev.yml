# Local dev stack for the Kind backend.
#
# Spins up only the datastores (Fuseki + Redis). The Moleculer node runs on
# the host via `cd backend && npm run dev` so hot-reload works.
#
# Run:  docker compose -f docker-compose.dev.yml up -d
# Stop: docker compose -f docker-compose.dev.yml down

services:
  fuseki:
    # Same image as prod (docker-compose.yml) — includes jena-permissions
    # required by @semapps/triplestore for WebACL secure datasets.
    image: semapps/jena-fuseki-webacl:v1.0.0
    container_name: kind-fuseki
    # Bound to loopback only. This is a dev stack — no reason to expose Fuseki
    # to the LAN/wifi we're sitting on.
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      ADMIN_PASSWORD: admin
      JVM_ARGS: -Xmx2g
    volumes:
      - fuseki-data:/fuseki

  redis:
    image: redis:7-alpine
    container_name: kind-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  fuseki-data:
  redis-data:
