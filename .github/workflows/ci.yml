# Build & typecheck on every pull request.
#
# Push to main is NOT triggered here on purpose — `deploy.yml` already does
# the build with the real production env vars before shipping, so running ci
# on main would just duplicate the work.
#
# ci is the safety net for the day external contributors send PRs: their
# secrets aren't available, so we run with placeholder VITE_* and only check
# that the build compiles + the types are sound.

name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (with placeholder env)
        run: npm run build
        env:
          VITE_FRONTEND_URL: https://akindnetwork.org
          VITE_DEFAULT_POD_PROVIDER: https://armoise.co

  # Parse-check every backend JS file. The backend has no test/build step
  # of its own (moleculer-runner consumes raw .js at boot), so without this
  # gate a SyntaxError or duplicate `const` declaration only surfaces in
  # production at container start — the runner exits, Docker restarts it
  # in a loop, and Caddy returns 502 on every upstream route. `node --check`
  # parses each file in strict mode without executing it, which catches
  # exactly that family of errors in ~1 second.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check backend JS
        run: find . -maxdepth 3 -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
