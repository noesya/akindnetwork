# Kind — production stack.
#
# Lives at the repo root. Deployed to /opt/kind/docker-compose.yml on the VPS
# by the GitHub Actions deploy workflow.
#
# Services:
#   caddy     — reverse proxy + TLS (Let's Encrypt). Serves /var/www/kind/dist
#               for the frontend and proxies api.akindnetwork.org to moleculer.
#   moleculer — the Kind backend (built from ./backend/). PeerReview,
#               Circles, Sources, the rate-limit + time-window middlewares.
#   fuseki    — Apache Jena Fuseki, the SPARQL endpoint. Same engine as the
#               dev stack (docker-compose.dev.yml) for dev/prod parity.
#   redis     — Moleculer queues + rate-limit counters.
#
# All long-lived data lives in named volumes so the host filesystem stays clean.
# No service except caddy exposes a host port — fuseki, moleculer, redis are
# only reachable on the internal Docker network.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/www/kind/dist:/srv/dist:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - moleculer

  moleculer:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Internal hostnames take precedence over .env values. Two Redis DBs:
      #   /7 → SemApps CacherMiddleware (action result cache)
      #   /8 → Moleculer transporter + BullMQ activity queue
      # Convention lifted from activitypods/app-boilerplate.
      SPARQL_ENDPOINT: http://fuseki:3030
      REDIS_CACHE_URL: redis://redis:6379/7
      REDIS_URL: redis://redis:6379/8
    volumes:
      # HTTP-signature keypairs (one per ActivityPub actor) — must survive
      # container restarts otherwise every redeploy invalidates federation
      # identity for all users that ever connected.
      - actors-data:/app/actors
    depends_on:
      fuseki:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').createConnection(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  fuseki:
    # SemApps' Fuseki distribution: stain/jena-fuseki + jena-permissions module
    # pre-installed (required by @semapps/triplestore to create the "secure
    # datasets" used for WebACL row-level access control). Pinned to v1.0.0
    # rather than :latest so deploys are reproducible.
    image: semapps/jena-fuseki-webacl:v1.0.0
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD}
      JVM_ARGS: -Xmx1g
    volumes:
      - fuseki-data:/fuseki
    # /$/ping is Fuseki's built-in liveness endpoint. The $$ escapes compose's
    # own variable interpolation so the literal $ reaches the shell.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3030/$$/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy-data:
  caddy-config:
  fuseki-data:
  redis-data:
  actors-data:
